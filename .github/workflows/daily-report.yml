name: Daily SOL-USDC paper report

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate paper-only report
        run: python paper_trader.py --days 30 --output reports/latest.md
      - name: Commit latest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.md
          git diff --cached --quiet || git commit -m "Update daily SOL/USDC paper report"
          git push
